name: Chain test

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Служебный флаг: этот запуск — звено цепочки"
        type: string
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: chain-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Если это звено — просто завершиться
        if: ${{ inputs.link == '1' }}
        run: echo "linked run started ok"

      - name: Передать эстафету
        if: ${{ inputs.link != '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/chain-test.yml/dispatches" \
            -d '{"ref":"main","inputs":{"link":"1"}}')
          echo "dispatch HTTP $code"
          test "$code" = "204"
