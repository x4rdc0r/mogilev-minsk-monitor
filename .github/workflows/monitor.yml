name: Seat monitor

on:
  schedule:
    # GitHub cron работает в UTC, запуск каждые 5 минут
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Проверить без отправки в Telegram"
        type: boolean
        default: false
      test_message:
        description: "Отправить тестовое сообщение в Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seat-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка мест
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python monitor.py ${{ inputs.test_message && '--test' || '' }}

      - name: Сохранить состояние
        run: |
          set -e
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json без изменений"
            exit 0
          fi
          git -c user.name="seat-monitor" \
              -c user.email="seat-monitor@users.noreply.github.com" \
              commit -q -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            if git push; then
              exit 0
            fi
            sleep 3
          done
          echo "не удалось сохранить state.json" >&2
          exit 1
