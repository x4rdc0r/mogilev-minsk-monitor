name: Seat monitor

on:
  schedule:
    # Резервный запуск, если цепочка почему-то оборвётся.
    # GitHub cron работает в UTC и может опаздывать — поэтому основной
    # механизм не cron, а самопродление запуска (см. шаг «Передать эстафету»).
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Проверить без отправки в Telegram"
        type: boolean
        default: false
      test_message:
        description: "Отправить тестовое сообщение в Telegram"
        type: boolean
        default: false
      loop_seconds:
        description: "Длительность прогона в секундах (по умолчанию 20700 = 5ч45м)"
        type: string
        default: ""
      interval:
        description: "Интервал между проверками в секундах (по умолчанию 150)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: seat-monitor
  # true — чтобы кнопка «Проверить» в боте сразу перезапускала цикл,
  # а не ждала окончания текущего шестичасового прогона.
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Разовый запуск (dry-run / тест)
        if: ${{ inputs.dry_run || inputs.test_message }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python monitor.py ${{ inputs.test_message && '--test' || '' }}

      - name: Проверки в цикле
        if: ${{ !(inputs.dry_run || inputs.test_message) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_INTERVAL: ${{ inputs.interval || '150' }}
          LOOP_SECONDS: ${{ inputs.loop_seconds || '20700' }}
          RELAY: ${{ inputs.loop_seconds && '0' || '1' }}
        run: |
          set -u
          interval="${CHECK_INTERVAL:-150}"
          deadline=$(( $(date +%s) + ${LOOP_SECONDS:-20700} ))
          run=0
          echo "цикл до $(date -u -d "@$deadline" +%Y-%m-%dT%H:%M:%SZ), интервал ${interval}s"

          while [ "$(date +%s)" -lt "$deadline" ]; do
            run=$((run + 1))
            echo "── проверка #$run, $(date -u +%H:%M:%SZ)"
            python monitor.py || echo "::warning::monitor.py завершился с ошибкой"

            if ! git diff --quiet -- state.json 2>/dev/null; then
              git add state.json
              git -c user.name="seat-monitor" \
                  -c user.email="seat-monitor@users.noreply.github.com" \
                  commit -q -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              pushed=0
              for attempt in 1 2 3 4 5; do
                if ! git pull --rebase --autostash origin main >/dev/null 2>&1; then
                  git rebase --abort >/dev/null 2>&1 || true
                fi
                if git push -q; then
                  pushed=1
                  break
                fi
                sleep 3
              done
              if [ "$pushed" = "1" ]; then
                echo "state.json сохранён"
              else
                echo "::warning::не удалось сохранить state.json"
              fi
            fi

            sleep "$interval"
          done

      - name: Передать эстафету
        if: ${{ success() && !(inputs.dry_run || inputs.test_message) && inputs.loop_seconds == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/monitor.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$code" = "204" ]; then
              echo "следующий запуск поставлен в очередь"
              exit 0
            fi
            echo "dispatch вернул HTTP $code, повтор"
            sleep 5
          done
          echo "::error::не удалось передать эстафету следующему запуску"
          exit 1
