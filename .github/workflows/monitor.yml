name: Seat monitor

on:
  schedule:
    # GitHub cron работает в UTC, запуск каждые 5 минут
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Проверить без отправки в Telegram"
        type: boolean
        default: false
      test_message:
        description: "Отправить тестовое сообщение в Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seat-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка мест
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_DATE: "2026-11-08"
          FROM_CITY: "2"
          DEST_CITY: "1"
          WINDOW_START: "16:30"
          WINDOW_END: "20:00"
          MIN_FREE_SEATS: "1"
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python monitor.py ${{ inputs.test_message && '--test' || '' }}

      - name: Сохранить состояние
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "state.json без изменений"
            exit 0
          fi
          git config user.name "seat-monitor"
          git config user.email "seat-monitor@users.noreply.github.com"
          git add state.json
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
