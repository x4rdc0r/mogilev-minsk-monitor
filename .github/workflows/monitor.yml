name: Seat monitor

on:
  schedule:
    # Резерв на случай, если бот-сторож не сможет поднять цепочку.
    # GitHub cron здесь сильно опаздывает (на часы), поэтому основной
    # планировщик — бот: он держит цепочку с 08:00 до 01:00 (Минск).
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "Разовая проверка (кнопка «Проверить» в боте)"
        type: boolean
        default: false
      dry_run:
        description: "Проверить без отправки в Telegram"
        type: boolean
        default: false
      test_message:
        description: "Отправить тестовое сообщение в Telegram"
        type: boolean
        default: false
      loop_seconds:
        description: "Длительность прогона в секундах (по умолчанию 20700 = 5ч45м)"
        type: string
        default: ""
      interval:
        description: "Интервал между проверками в секундах (по умолчанию 150)"
        type: string
        default: ""
      no_relay:
        description: "Не передавать эстафету (для отладочных коротких прогонов)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  # Разовая проверка живёт в отдельной группе: она не обрывает длинную цепочку.
  group: seat-monitor-${{ (inputs.once || inputs.dry_run || inputs.test_message || inputs.no_relay) && 'once' || 'chain' }}
  # В группе разовых проверок новая отменяет старую; цепочку не отменяем.
  cancel-in-progress: ${{ inputs.once || inputs.dry_run || inputs.test_message || inputs.no_relay || false }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Разовый запуск (разово / dry-run / тест)
        if: ${{ inputs.once || inputs.dry_run || inputs.test_message }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python monitor.py ${{ inputs.test_message && '--test' || '' }}

      - name: Проверки в цикле
        if: ${{ !(inputs.once || inputs.dry_run || inputs.test_message) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_INTERVAL: ${{ inputs.interval || '150' }}
          LOOP_SECONDS: ${{ inputs.loop_seconds || '20700' }}
        run: |
          set -u
          interval="${CHECK_INTERVAL:-150}"
          deadline=$(( $(date +%s) + ${LOOP_SECONDS:-20700} ))
          run=0
          echo "цикл до $(date -u -d "@$deadline" +%Y-%m-%dT%H:%M:%SZ), интервал ${interval}s"

          while [ "$(date +%s)" -lt "$deadline" ]; do
            # Ночью (01:00–08:00 по Минску) не работаем: 22:00–04:59 UTC.
            hour=$((10#$(date -u +%H)))
            if [ "$hour" -ge 22 ] || [ "$hour" -lt 5 ]; then
              echo "вне окна 08:00–01:00 (Минск) — завершаю цепочку"
              break
            fi

            run=$((run + 1))

            # Подтягиваем настройки, которые бот записал в config.json,
            # и правки кода. state.json к этому моменту закоммичен.
            if ! git pull --rebase --autostash origin main >/dev/null 2>&1; then
              git rebase --abort >/dev/null 2>&1 || true
            fi

            echo "── проверка #$run, $(date -u +%H:%M:%SZ)"
            python monitor.py || echo "::warning::monitor.py завершился с ошибкой"

            if ! git diff --quiet -- state.json 2>/dev/null; then
              git add state.json
              git -c user.name="seat-monitor" \
                  -c user.email="seat-monitor@users.noreply.github.com" \
                  commit -q -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              pushed=0
              for attempt in 1 2 3 4 5; do
                if ! git pull --rebase --autostash origin main >/dev/null 2>&1; then
                  git rebase --abort >/dev/null 2>&1 || true
                fi
                if git push -q; then
                  pushed=1
                  break
                fi
                sleep 3
              done
              if [ "$pushed" = "1" ]; then
                echo "state.json сохранён"
              else
                echo "::warning::не удалось сохранить state.json"
              fi
            fi

            sleep "$interval"
          done

      - name: Передать эстафету
        if: ${{ success() && !(inputs.once || inputs.dry_run || inputs.test_message) && !inputs.no_relay }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hour=$((10#$(date -u +%H)))
          if [ "$hour" -ge 22 ] || [ "$hour" -lt 5 ]; then
            echo "вне окна 08:00–01:00 (Минск) — эстафета не передаётся"
            exit 0
          fi

          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/monitor.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$code" = "204" ]; then
              echo "следующий запуск поставлен в очередь"
              exit 0
            fi
            echo "dispatch вернул HTTP $code, повтор"
            sleep 5
          done
          echo "::error::не удалось передать эстафету следующему запуску"
          exit 1

      - name: Сохранить состояние разовой проверки
        if: ${{ (inputs.once || inputs.dry_run) && success() }}
        run: |
          set -e
          git add state.json
          if git diff --cached --quiet; then
            echo "state.json без изменений"
            exit 0
          fi
          git -c user.name="seat-monitor" \
              -c user.email="seat-monitor@users.noreply.github.com" \
              commit -q -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main >/dev/null 2>&1 || true
            if git push -q; then
              exit 0
            fi
            sleep 3
          done
          echo "не удалось сохранить state.json" >&2
          exit 1
